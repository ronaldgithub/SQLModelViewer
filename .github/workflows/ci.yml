name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SQLModelViewer.sln

      - name: Build
        run: dotnet build SQLModelViewer.sln -c Release --no-restore

      - name: Test
        run: dotnet test SQLModelViewer.sln -c Release --no-build
